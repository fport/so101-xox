<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">SO-101 XOX</title>
  <desc id="d">A robot arm that plays tic-tac-toe. Claude decides, SmolVLA moves. The picture shows what the top camera sees: a wooden table with a three by three grid made of four black bars, white ring O pieces on the left, red X pieces on the right, and the SO-101 arm reaching in from the bottom edge to put a red X in the top left cell. Below, the pipeline from left to right: Camera, Claude (reads the board, picks a cell), the sentence "put the red X in the top left cell", SmolVLA, arm. Built with LeRobot, SmolVLA, Strands Robots and Claude.</desc>
  <style>
    .pick { animation: pick 3s ease-in-out infinite; }
    @keyframes pick { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .pick { animation: none; } }
  </style>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13232c"/>
      <stop offset="1" stop-color="#0b161c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="976" cy="224" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8b878" stop-opacity=".16"/>
      <stop offset="1" stop-color="#e8b878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b383"/>
      <stop offset="1" stop-color="#c69a68"/>
    </linearGradient>
    <radialGradient id="vig" cx="240" cy="150" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#3b2208" stop-opacity="0"/>
      <stop offset="1" stop-color="#3b2208" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f4f1"/>
      <stop offset=".55" stop-color="#d9dcd8"/>
      <stop offset="1" stop-color="#aeb3af"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="deep" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="frame"><rect width="480" height="360" rx="14"/></clipPath>

    <g id="xs">
      <rect x="-20" y="-5.5" width="40" height="11" rx="2.2" transform="rotate(45)"/>
      <rect x="-20" y="-5.5" width="40" height="11" rx="2.2" transform="rotate(-45)"/>
    </g>
    <g id="x">
      <use href="#xs" transform="translate(2.5 3.5)" fill="#40260c" opacity=".38"/>
      <use href="#xs" fill="#d4351e"/>
      <path d="M-11-11 11 11M-11 11 11-11" fill="none" stroke="#f47a5b" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="o">
      <circle cx="2.5" cy="3.5" r="14.5" fill="none" stroke="#40260c" stroke-opacity=".32" stroke-width="7"/>
      <circle r="14.5" fill="none" stroke="#f7f4ec" stroke-width="7"/>
      <circle r="11.6" fill="none" stroke="#c9c1b1" stroke-width="1.1"/>
    </g>
    <g id="bars">
      <rect x="197" y="27" width="12" height="242" rx="6"/>
      <rect x="271" y="27" width="12" height="242" rx="6"/>
      <rect x="119" y="105" width="242" height="12" rx="6"/>
      <rect x="119" y="179" width="242" height="12" rx="6"/>
    </g>
    <g id="armshape">
      <circle r="27"/>
      <rect x="-18" y="-124" width="36" height="110" rx="6"/>
      <rect x="-21" y="-160" width="42" height="44" rx="5"/>
      <rect x="-15" y="-214" width="30" height="62" rx="5"/>
      <rect x="-19" y="-242" width="38" height="38" rx="5"/>
      <rect x="-32" y="-258" width="64" height="20" rx="4"/>
      <path d="M-32-254h12.5v-38l-3.5-14h-6l-3 14zM19.5-254H32v-38l-3-14h-6l-3.5 14z"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" rx="28" fill="url(#ink)"/>
  <rect width="1280" height="640" rx="28" fill="url(#lamp)"/>
  <rect x=".75" y=".75" width="1278.5" height="638.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>

  <!-- title -->
  <text x="62" y="196" font-size="96" font-weight="800" letter-spacing="-2.5" fill="#f5efe3">SO-101 XOX</text>
  <text font-size="30" fill="#b9c7c9">
    <tspan x="64" y="254">A robot arm that plays tic-tac-toe.</tspan>
    <tspan x="64" y="296">Claude decides, SmolVLA moves.</tspan>
  </text>

  <!-- what the top camera sees -->
  <rect x="744" y="62" width="464" height="354" rx="20" fill="#000" opacity=".55" filter="url(#deep)"/>
  <path d="M726 58V42a8 8 0 0 1 8-8h16M1202 34h16a8 8 0 0 1 8 8v16M1226 390v16a8 8 0 0 1-8 8h-16M750 414h-16a8 8 0 0 1-8-8v-16" fill="none" stroke="#6f8892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(736 44)">
    <g clip-path="url(#frame)">
      <rect width="480" height="360" fill="url(#wood)"/>
      <g fill="none" stroke-linecap="round">
        <g stroke="#a67845" stroke-opacity=".34">
          <path d="M-5 22C90 16 210 30 330 21S440 14 485 19" stroke-width="1.4"/>
          <path d="M-5 58C120 66 240 50 360 57S450 62 485 55" stroke-width="1"/>
          <path d="M-5 96C80 90 170 102 300 94S430 90 485 97" stroke-width="1.8"/>
          <path d="M-5 140C110 147 250 133 370 141S455 146 485 139" stroke-width="1"/>
          <path d="M-5 171C70 166 190 177 310 169S440 164 485 172" stroke-width="1.3"/>
          <path d="M-5 214C130 221 240 207 350 215S450 219 485 212" stroke-width="2"/>
          <path d="M-5 252C100 246 220 258 330 250S440 245 485 253" stroke-width="1"/>
          <path d="M-5 290C120 297 230 283 360 291S450 296 485 288" stroke-width="1.5"/>
          <path d="M-5 331C90 325 210 337 320 329S440 324 485 333" stroke-width="1.1"/>
        </g>
        <g stroke="#f0d3a6" stroke-opacity=".4">
          <path d="M-5 40C100 46 230 34 340 41S450 45 485 38" stroke-width="2.4"/>
          <path d="M-5 120C120 113 220 126 340 118S450 114 485 121" stroke-width="3"/>
          <path d="M-5 232C90 239 230 226 350 233S450 237 485 231" stroke-width="2.2"/>
          <path d="M-5 310C110 304 240 316 350 308S450 304 485 311" stroke-width="3"/>
        </g>
      </g>

      <!-- grid: four black bars -->
      <use href="#bars" transform="translate(2.5 3.5)" fill="#40260c" opacity=".35"/>
      <use href="#bars" fill="#1c1c1e"/>
      <g fill="none" stroke="#3b3b40" stroke-width="1.2" stroke-linecap="round">
        <path d="M200.5 33v230M274.5 33v230M125 108.5h230M125 182.5h230"/>
      </g>

      <!-- O rings waiting on the left -->
      <use href="#o" x="36" y="74"/>
      <use href="#o" x="83" y="72"/>
      <use href="#o" x="35" y="149"/>
      <use href="#o" x="37" y="223"/>

      <!-- X pieces waiting on the right, pick slot outlined and empty -->
      <use href="#x" transform="translate(398 73) rotate(4)"/>
      <use href="#x" transform="translate(445 75) rotate(-5)"/>
      <use href="#x" transform="translate(399 148) rotate(-3)"/>
      <use href="#x" transform="translate(444 147) rotate(6)"/>
      <use href="#xs" transform="translate(398 222)" fill="none" stroke="#fbeed2" stroke-opacity=".75" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- pieces already played -->
      <use href="#o" x="240" y="73"/>
      <use href="#o" x="315" y="75"/>
      <use href="#x" transform="translate(241 148) rotate(5)"/>

      <!-- the cell Claude picked -->
      <rect class="pick" x="131" y="39" width="62" height="62" rx="11" fill="#fff6df" fill-opacity=".2" stroke="#fff6df" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round"/>

      <!-- arm, seen from above, entering from the robot's edge -->
      <rect x="210" y="326" width="96" height="60" rx="9" fill="#2a1704" opacity=".4" filter="url(#soft)"/>
      <use href="#armshape" transform="translate(264 355) rotate(-18.2)" fill="#2a1704" opacity=".42" filter="url(#soft)"/>
      <use href="#xs" transform="translate(171 81)" fill="#2a1704" opacity=".3" filter="url(#soft)"/>
      <use href="#x" transform="translate(164 72)"/>
      <rect x="204" y="318" width="96" height="60" rx="9" fill="#1d1e21"/>
      <rect x="204" y="318" width="96" height="60" rx="9" fill="none" stroke="#3a3c41" stroke-width="1.5"/>
      <g transform="translate(252 340) rotate(-18.2)">
        <!-- turret and shoulder -->
        <circle r="27" fill="#2b2d31" stroke="#4a4d53" stroke-width="2"/>
        <!-- upper arm -->
        <rect x="-18" y="-124" width="36" height="112" rx="6" fill="url(#link)"/>
        <rect x="-7" y="-106" width="14" height="62" rx="5" fill="#9ba19d"/>
        <circle cx="-11" cy="-24" r="2.4" fill="#6d726f"/><circle cx="11" cy="-24" r="2.4" fill="#6d726f"/>
        <!-- forearm -->
        <rect x="-15" y="-214" width="30" height="62" rx="5" fill="url(#link)"/>
        <rect x="-5.5" y="-200" width="11" height="34" rx="4" fill="#9ba19d"/>
        <!-- elbow servo -->
        <rect x="-21" y="-160" width="42" height="44" rx="5" fill="#232427"/>
        <circle cy="-138" r="9.5" fill="#9a9f9c"/><circle cy="-138" r="3.2" fill="#232427"/>
        <!-- cable -->
        <path d="M20-22C44-52 42-96 23-120M21-154C38-172 35-196 20-208" fill="none" stroke="#17181a" stroke-width="2.6" stroke-linecap="round"/>
        <!-- wrist servo -->
        <rect x="-19" y="-242" width="38" height="38" rx="5" fill="#232427"/>
        <circle cy="-223" r="7.5" fill="#9a9f9c"/><circle cy="-223" r="2.6" fill="#232427"/>
        <!-- gripper: black plate with a fixed jaw, orange moving jaw -->
        <rect x="-32" y="-258" width="64" height="20" rx="4" fill="#232427"/>
        <path d="M-32-254h12.5v-38l-3.5-14h-6l-3 14z" fill="#232427"/>
        <path d="M19.5-256H32v-36l-3-14h-6l-3.5 14z" fill="#ef8a1f"/>
        <path d="M22-255v-36" stroke="#ffb866" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="25.5" cy="-248" r="3.4" fill="#9a9f9c"/>
      </g>

      <rect width="480" height="360" fill="url(#vig)"/>
    </g>
    <rect x=".75" y=".75" width="478.5" height="358.5" rx="13.25" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>
  </g>

  <!-- pipeline -->
  <path d="M69 476H1095" stroke="#3a5560" stroke-width="2"/>
  <path d="M174 469l7 7-7 7M425 469l7 7-7 7M870 469l7 7-7 7M1058 469l7 7-7 7" fill="none" stroke="#e2bb86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e2bb86">
    <circle cx="69.5" cy="476" r="5.5"/><circle cx="211.5" cy="476" r="5.5"/><circle cx="905.5" cy="476" r="5.5"/><circle cx="1095.5" cy="476" r="5.5"/>
  </g>
  <rect x="452" y="453" width="396" height="46" rx="23" fill="#172b34" stroke="#e2bb86" stroke-width="1.6"/>
  <text x="650" y="484" text-anchor="middle" font-size="23" font-weight="500" fill="#f5efe3">“put the red X in the top left cell”</text>
  <g font-size="24" font-weight="700" fill="#f5efe3">
    <text x="64" y="450">Camera</text>
    <text x="206" y="450">Claude</text>
    <text x="900" y="450">SmolVLA</text>
    <text x="1090" y="450">Arm</text>
  </g>
  <g font-size="20" fill="#9fb1b5">
    <text x="64" y="527">top view</text>
    <text x="206" y="527">reads board, picks cell</text>
    <text x="650" y="527" text-anchor="middle">the exact training sentence</text>
    <text x="900" y="527">moves the arm</text>
    <text x="1090" y="527">places the X</text>
  </g>

  <!-- footer tags -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.3">
    <rect x="64" y="566" width="100" height="32" rx="16"/>
    <rect x="174" y="566" width="108" height="32" rx="16"/>
    <rect x="292" y="566" width="158" height="32" rx="16"/>
    <rect x="460" y="566" width="90" height="32" rx="16"/>
  </g>
  <g font-size="18" fill="#b9c7c9" text-anchor="middle">
    <text x="114" y="588">LeRobot</text>
    <text x="228" y="588">SmolVLA</text>
    <text x="371" y="588">Strands Robots</text>
    <text x="505" y="588">Claude</text>
  </g>
</svg>
